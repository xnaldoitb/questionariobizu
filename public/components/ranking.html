<div class="modal-overlay hidden" id="rankingModal" role="dialog" aria-modal="true" aria-labelledby="rankingTitle">
    <section class="report-modal report-modal-ranking ranking-v5-modal">
        <header class="report-modal-header">
            <div>
                <p class="eyebrow"><span class="dot"></span> classificação geral</p>
                <h2 id="rankingTitle">Ranking de estudos</h2>
                <p>Classificação por acertos, aproveitamento e questões respondidas.</p>
            </div>
            <button class="modal-close" id="rankingClose" type="button" aria-label="Fechar ranking">×</button>
        </header>

        <div class="my-ranking-card" id="myRankingCard"></div>
        <div class="ranking-podium" id="rankingPodium"></div>

        <div class="report-toolbar">
            <div>
                <strong>Classificação geral</strong>
                <span>Os melhores resultados aparecem primeiro.</span>
            </div>
            <div class="data-actions">
                <button class="btn ghost mini" id="rankingRefresh" type="button">Atualizar</button>
                <button class="btn ghost mini danger" id="rankingReset" type="button">Resetar ranking</button>
            </div>
        </div>

        <div class="report-list ranking-list" id="rankingList"></div>
    </section>
</div>
