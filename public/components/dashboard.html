<section id="dashboard">
    <div class="study-intro">
        <div>
            <p class="eyebrow"><span class="dot"></span> questões bizuradas</p>
            <h1>Banco de Questões</h1>
            <p>
                Escolha uma disciplina, um capítulo e a quantidade de questões.
                Seu histórico e desempenho serão salvos automaticamente.
            </p>
        </div>

        <div class="user-badge" aria-label="Usuário conectado">
            <span class="user-badge-label">Usuário conectado</span>
            <strong id="userName"></strong>
            <small id="userRole"></small>
        </div>
    </div>

    <div class="panel study-panel">
        <div class="filters-grid">
            <label>
                Disciplina
                <select id="subjectSelect"></select>
            </label>

            <label>
                Capítulo
                <select id="chapterSelect"></select>
            </label>

            <label>
                Quantidade
                <select id="limitSelect">
                    <option value="10">10 questões</option>
                    <option value="20">20 questões</option>
                    <option value="30">30 questões</option>
                    <option value="50">50 questões</option>
                    <option value="500">Todas</option>
                </select>
            </label>

            <button class="btn primary start-button" id="startBtn" type="button">
                Iniciar simulado
            </button>
        </div>
    </div>
</section>
