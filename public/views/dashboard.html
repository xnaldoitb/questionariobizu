<section id="dashboard">
    <div class="profile-dashboard" aria-label="Resumo do aluno">
        <div class="profile-identity">
            <div class="profile-avatar" id="profileAvatar" aria-hidden="true">AL</div>
            <div>
                <span class="profile-kicker" id="profileKicker">Aluno conectado</span>
                <h1 id="profileWarName">—</h1>
                <p id="profileRegistration">AL SD PM Nº: —</p>
            </div>
        </div>

        <div class="profile-metrics">
            <article class="profile-metric profile-rank">
                <span>Colocação</span>
                <strong id="profileRanking">—</strong>
                <small>no ranking geral</small>
            </article>
            <article class="profile-metric">
                <span>Questões respondidas</span>
                <strong id="profileAnswered">0</strong>
                <small>respostas registradas</small>
            </article>
            <article class="profile-metric profile-hits">
                <span>Acertos</span>
                <strong id="profileCorrect">0</strong>
                <small>respostas corretas</small>
            </article>
        </div>
    </div>

    <div class="study-intro compact-study-intro">
        <div>
            <p class="section-kicker"><span class="kicker-mark"></span> questões bizuradas</p>
            <p>
                Escolha uma disciplina, um capítulo e a quantidade de questões.
                Seu desempenho será registrado automaticamente.
            </p>
        </div>
    </div>

    <div class="panel study-panel">
        <div class="filters-grid">
            <label>
                Disciplina
                <select id="subjectSelect"></select>
            </label>
            <label>
                Capítulo
                <select id="chapterSelect"></select>
            </label>
            <label>
                Quantidade
                <select id="limitSelect">
                    <option value="all" selected>Todas</option>
                    <option value="10">10 questões</option>
                    <option value="20">20 questões</option>
                    <option value="30">30 questões</option>
                    <option value="50">50 questões</option>
                    <option value="100">100 questões</option>
                </select>
            </label>
            <button class="ui-button main-action start-button" id="startBtn" type="button">Iniciar simulado</button>
        </div>
        <label class="study-review-filter" for="reviewPendingOnly">
            <input id="reviewPendingOnly" type="checkbox"/>
            <span><strong>Revisão inteligente</strong> — responder somente questões ainda não respondidas ou cuja resposta mais recente esteja errada.</span>
        </label>
    </div>
</section>
