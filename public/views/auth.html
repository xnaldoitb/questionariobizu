<section class="login-shell" id="loginView">
    <div class="login-card">
        <div class="login-brand-head">
            <img
                class="login-slogan-image"
                src="/assets/logo-questionario-bizu.svg?v=4.48.1"
                alt="Questionário Bizu — Seu bizu para a aprovação"
                width="190"
                height="72"
            >
        </div>

        <p class="muted">Acesso ao ambiente de estudos para o CFP.</p>

        <div class="auth-tabs">
            <button class="auth-tab active" id="showLogin" type="button">Entrar</button>
            <button class="auth-tab" id="showSignup" type="button">Criar conta</button>
        </div>

        <form id="loginForm">
            <label>
                AL SD PM Nº:
                <input
                    autocomplete="username"
                    id="loginUser"
                    inputmode="numeric"
                    placeholder="Informe seu número"
                    required
                >
            </label>
            <label>
                Senha
                <input autocomplete="current-password" id="loginPass" required type="password">
            </label>
            <button class="ui-button main-action full">Entrar</button>
            <p class="error" id="loginError"></p>
        </form>

        <form class="hidden" id="signupForm">
            <label class="signup-honeypot" aria-hidden="true">
                Não preencha este campo
                <input id="signupWebsite" name="website" tabindex="-1" autocomplete="off">
            </label>
            <div class="trial-signup-note">
                <strong>Teste gratuito de 30 minutos</strong>
                <span>O teste começa após o login e conta só o uso ativo. São 30 minutos por ciclo de 8h para quem não tem plano válido. Escolha um plano para estudar sem esse limite.</span>
            </div>
            <label>
                Nome de Guerra
                <input id="signupName" minlength="2" placeholder="Ex.: AMORIM" required>
            </label>
            <label>
                AL SD PM Nº: (mínimo 3 dígitos)
                <input
                    autocomplete="username"
                    id="signupUser"
                    inputmode="numeric"
                    minlength="3"
                    placeholder="Informe seu número"
                    required
                >
            </label>
            <label>
                Telefone do WhatsApp
                <input
                    autocomplete="tel"
                    id="signupWhatsapp"
                    inputmode="tel"
                    maxlength="19"
                    placeholder="Ex.: (91) 98257-5188"
                    required
                >
            </label>
            <label>
                Senha (mínimo 6 caracteres)
                <input autocomplete="new-password" id="signupPass" minlength="6" maxlength="72" required type="password">
            </label>
            <label>
                Confirmar senha
                <input autocomplete="new-password" id="signupConfirm" minlength="6" maxlength="72" required type="password">
            </label>
            <button class="ui-button main-action full">Criar minha conta</button>
            <p class="error" id="signupError"></p>
        </form>

    </div>
</section>
