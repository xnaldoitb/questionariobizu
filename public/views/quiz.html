<section class="hidden" id="quizView">
<div class="quiz-head">
<button class="ui-button quiet-action" id="backBtn">← Voltar</button>
<div class="progress-wrap">
<div class="progress">
<span id="quizProgressBar"></span>
</div>
<small id="progressText"></small>
</div>
<strong id="scoreText"></strong>
</div>
<article class="question-card">
<div class="question-meta">
<span id="questionChapter"></span>
<span id="questionNumber"></span>
</div>
<h2 id="questionText"></h2>
<p class="answer-tools-hint"><span aria-hidden="true">✂</span> Use a tesoura para riscar alternativas que considerar incorretas. Depois selecione sua resposta e confirme.</p>
<div class="answer-list" id="answerList"></div>
<div class="answer-explanation hidden" id="resolution">
<strong>Resolução comentada</strong>
<p id="resolutionText"></p>
</div>
<div class="quiz-controls">
<button class="ui-button quiet-action" id="skipBtn">Pular</button>
<button class="ui-button confirm-answer-action" disabled id="confirmAnswerBtn" type="button">Confirmar resposta</button>
<button class="ui-button main-action" disabled id="nextBtn">Próxima →</button>
</div>
</article>
</section>
